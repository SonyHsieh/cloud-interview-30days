<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雲端建置與設定｜面試練習 30 天</title>
<style>
:root{--bg:#f5f7fa;--panel:#ffffff;--text:#1d2330;--muted:#5b6578;--line:#dde3ec;--accent:#0a6cb8;--ok:#1e8e3e;--bad:#c5221f;--own:#fde7c7;--cloud:#d7f0e0}
body.dark{--bg:#12151c;--panel:#1c2130;--text:#e6e9f0;--muted:#9aa4b8;--line:#2d3446;--accent:#4aa3ff;--own:#5a4420;--cloud:#1f4a32}
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
.wrap{display:flex;min-height:100vh}
aside{width:260px;min-width:260px;background:var(--panel);border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
main{flex:1;padding:24px 28px;max-width:980px}
h1{font-size:1.25rem;margin:0 0 2px}
h2{font-size:1.08rem;margin:22px 0 8px;border-bottom:2px solid var(--line);padding-bottom:4px}
h3{font-size:1.4rem;margin:0 0 6px}
.sub{color:var(--muted);font-size:.9rem}
.day-btn{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--text);padding:8px 10px;border-radius:6px;cursor:pointer;font-size:.95rem;margin-bottom:4px;font-family:inherit}
.day-btn:hover{border-color:var(--line)}
.day-btn.active{background:var(--accent);color:#fff}
.day-btn.done::after{content:" ✓";color:var(--ok);font-weight:bold}
.day-btn.active.done::after{color:#fff}
.progress{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 12px}
.progress>div{height:100%;background:var(--ok);width:0;transition:width .3s}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
button.tool{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
button.tool.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.tag{display:inline-block;font-size:.8rem;background:var(--line);padding:2px 8px;border-radius:10px;margin:0 6px 6px 0;color:var(--muted)}
.tag.sec{background:#fbe3e1;color:#8a1c17}
body.dark .tag.sec{background:#4a2321;color:#ffb4ab}
ul{padding-left:20px;margin:6px 0}
li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--line)}
.opt{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:6px;margin:4px 0;cursor:pointer;font-family:inherit;font-size:.95rem}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:rgba(30,142,62,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(197,34,31,.12)}
.exp{font-size:.9rem;color:var(--muted);margin:6px 0 10px}
.task label{display:block;margin:6px 0;cursor:pointer}
.stack{display:flex;flex-direction:column;gap:4px;max-width:440px;margin:8px 0}
.layer{padding:9px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--line);display:flex;justify-content:space-between;font-size:.95rem}
.layer.own{background:var(--own)}
.layer.cloud{background:var(--cloud)}
.layer.sel{outline:2px solid var(--accent)}
.legend{font-size:.85rem;color:var(--muted);margin:6px 0}
.info{background:var(--line);border-radius:6px;padding:10px;margin-top:8px;font-size:.93rem;min-height:44px}
details summary{cursor:pointer;color:var(--accent);margin:8px 0;font-weight:600}
.ref{background:var(--line);border-radius:6px;padding:10px 12px;font-size:.93rem;white-space:pre-line}
.score{font-size:.9rem;color:var(--muted);margin-top:6px}
.nav-row{display:flex;justify-content:space-between;margin-top:18px}
@media print{aside,.noprint{display:none!important}main{padding:0;max-width:none}body{background:#fff;color:#000}.card{border:1px solid #999}details{display:block}details>*{display:block}}
@media (max-width:760px){.wrap{flex-direction:column}aside{width:100%;min-width:0;height:auto;position:static}main{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="noprint">
    <h1>雲端建置與設定</h1>
    <div class="legend">面試練習｜30 天完整計畫（四週）</div>
    <div class="sub">總進度 <span id="pct">0%</span>（以每日任務計算）</div>
    <div class="progress"><div id="bar"></div></div>
    <div id="dayList"></div>
    <hr style="border:none;border-top:1px solid var(--line);margin:12px 0">
    <button class="day-btn" onclick="showView('day')">每日內容</button>
    <button class="day-btn" onclick="showView('bank')">面試題庫</button>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ================= 資料：第一週 ================= */
const DAYS = [
{
  title: "雲端基本概念與部署模型",
  one: "雲端是一種「依需求取用、依用量付費、可快速擴縮」的 IT 資源交付模式（依 NIST SP 800-145 定義）。",
  concepts: [
    "五大特徵：隨選自助服務（On-demand self-service）、廣泛網路存取、資源共享池（Resource pooling）、快速彈性（Rapid elasticity）、可量測服務（Measured service）。",
    "部署模型：公有雲（Public）、私有雲（Private）、社群雲（Community）、混合雲（Hybrid）。",
    "雲端與傳統機房的差異不只在地點，更在於採購方式、變更速度與責任分工的改變。"
  ],
  compare: {
    head: ["面向", "公有雲", "私有雲", "混合雲"],
    rows: [
      ["控制權", "較低，依服務商設計", "較高", "依工作負載分工而定"],
      ["成本模型", "以按用量付費為主", "前期投入與維運成本較高", "兩者組合"],
      ["典型用途", "彈性需求、快速上線", "高度客製或法規嚴格", "核心保留、彈性外移"],
      ["主要風險", "責任分工誤解、供應商依賴", "資源利用率低、擴充慢", "整合複雜、資料流動治理"]
    ]
  },
  tasks: [
    "用一句話舉例說明五大特徵各一項（共五句）",
    "比較公有雲與私有雲在控制權與成本上的差異",
    "說明「快速彈性」對營運與業務單位的實際影響"
  ],
  sec: ["ISO 27001:2022 A.5.23 雲端服務使用與管理", "參考：NIST SP 800-145"],
  interview: [
    {
      q: "雲端跟傳統機房最大的差別是什麼？",
      a: "參考答案（框架：本質→影響→治理）：\n1. 本質：交付模式改變，資源以服務形式按需取得，而非一次性採購硬體。\n2. 影響：採購與預算從 CapEx 轉向 OpEx，變更速度大幅提升，責任分工也隨服務模型改變。\n3. 治理：需要新的控制方式，例如帳號權限、成本治理與服務商風險管理。"
    }
  ],
  mcq: [
    { q: "NIST 定義的雲端五大特徵不包含下列哪一項？", o: ["隨選自助服務", "廣泛網路存取", "永久免費使用", "可量測服務"], a: 2, e: "雲端的特徵強調按需取用與按量計費，「永久免費」不屬於五大特徵。" },
    { q: "同時使用公有雲與私有雲資源的架構，通常稱為？", o: ["社群雲", "混合雲", "多租戶雲", "邊緣運算"], a: 1, e: "混合雲是私有與公有資源協作的架構。" },
    { q: "資源共享池（Resource pooling）的主要效益是？", o: ["提高資源使用率並降低單位成本", "完全消除資安風險", "不需要任何網路連線", "必須購買實體主機"], a: 0, e: "多租戶共享資源可提高使用率，但不代表消除資安風險，需另行控制。" }
  ]
},
{
  title: "服務模型：IaaS、PaaS、SaaS",
  one: "服務模型的差異在於「客戶要管理到哪一層」：層級越高，服務商管理越多，客戶可控制的越少。",
  concepts: [
    "IaaS：提供虛擬機、網路、儲存等基礎設施，客戶管理作業系統以上的內容。",
    "PaaS：提供應用執行平台，客戶主要管理應用程式與資料。",
    "SaaS：提供完整應用程式，客戶主要管理資料與使用者權限。",
    "延伸概念：容器（CaaS）、Serverless（FaaS），其抽象層級多介於 IaaS 與 PaaS 之間。"
  ],
  stack: true,
  compare: {
    head: ["模型", "客戶管理", "服務商管理", "常見範例"],
    rows: [
      ["IaaS", "作業系統、應用程式、資料", "虛擬化、實體基礎設施", "AWS EC2、Azure Virtual Machines、GCP Compute Engine"],
      ["PaaS", "應用程式、資料", "執行環境以下的所有層", "Azure App Service、AWS Elastic Beanstalk、Google App Engine"],
      ["SaaS", "資料、使用者與存取權限", "應用程式與平台全部", "Microsoft 365、Google Workspace、Salesforce"]
    ]
  },
  tasks: [
    "在上方架構圖切換模型，說出 IaaS 與 PaaS 的分界線在哪一層",
    "各舉一個雲端服務範例，並寫出選擇它的理由",
    "說明為何即使使用 SaaS，客戶仍需負責資料與權限"
  ],
  sec: ["SOC 2 報告中的互補使用者實體控制（CUEC）概念"],
  interview: [
    {
      q: "你會如何在 IaaS 與 PaaS 之間做選擇？",
      a: "參考答案（框架：決策標準→取捨→風險）：\n1. 決策標準：團隊維運能力、客製化需求、上市速度、合規對作業系統控制的要求。\n2. 取捨：IaaS 控制度高但維運成本高；PaaS 上手快、維運少，但平台限制較多。\n3. 風險：PaaS 可能產生供應商鎖定；IaaS 則容易因修補不及時產生漏洞。"
    }
  ],
  mcq: [
    { q: "使用 IaaS 時，通常由客戶負責管理哪一層？", o: ["實體機房", "作業系統", "資料中心電力"], a: 1, e: "IaaS 下客戶管理作業系統以上的層級，包括修補與強化。" },
    { q: "下列哪一項是 SaaS 的典型範例？", o: ["Azure Virtual Machines", "Microsoft 365", "AWS EC2", "GCP Compute Engine"], a: 1, e: "Microsoft 365 是完整的應用程式服務，屬於 SaaS。" },
    { q: "Serverless（FaaS）在抽象層級上通常較接近？", o: ["PaaS", "私有雲自建機房", "必須自管作業系統的 IaaS"], a: 0, e: "Serverless 由平台管理執行環境，客戶只需關注程式碼與事件觸發，較接近 PaaS 的抽象層級。" }
  ]
},
{
  title: "共同責任模型（Shared Responsibility）",
  one: "服務商負責「雲的安全」（Security of the cloud），客戶負責「雲中的安全」（Security in the cloud），分界線會依服務模型而移動。",
  concepts: [
    "服務商通常負責：實體設施、資料中心門禁、硬體、虛擬化層與基礎網路。",
    "客戶通常負責：身分與存取管理、資料分類與加密設定、網路與防火牆規則、組態正確性、應用程式安全。",
    "常見誤解：「買了雲就安全」。雲端服務商提供安全工具，但設定與使用是客戶的責任。",
    "面試重點：責任分工必須寫入契約、SLA 與資料處理協議，並以稽核報告（如 SOC 2）佐證。"
  ],
  tasks: [
    "列出客戶必須負責的三項事項，並說明每項的風險",
    "查閱任一服務商的共同責任文件，摘錄一項你認為最容易被誤解的內容",
    "用三句話寫出你向主管說明「雲端不等於自動安全」的版本"
  ],
  sec: ["ISO/IEC 27017（雲端服務資訊安全控制）", "ISO/IEC 27018（公有雲個資保護）", "ISO 27001:2022 A.5.23"],
  interview: [
    {
      q: "雲端服務商發生資安事件，我們還需要負責嗎？",
      a: "參考答案（框架：責任歸屬→控制→證據）：\n1. 責任歸屬：服務商對基礎設施負責，但客戶資料、身分、組態與存取仍由客戶負責。\n2. 控制：透過 MFA、最小權限、加密、日誌與告警，把客戶端責任落實。\n3. 證據：以契約（SLA、DPA）、服務商稽核報告（如 SOC 2、ISO 27001 證書）與自身稽核紀錄，證明責任已被適當管理。"
    }
  ],
  mcq: [
    { q: "下列哪一項通常屬於客戶責任？", o: ["資料中心門禁", "資料加密與存取權限設定", "實體硬碟報廢"], a: 1, e: "資料加密與權限設定屬於「雲中的安全」，由客戶負責。" },
    { q: "「雲的安全」（Security of the cloud）主要指？", o: ["服務商負責的基礎設施安全", "客戶應用程式的漏洞", "使用者密碼強度"], a: 0, e: "雲的安全指服務商負責的基礎設施層。" },
    { q: "在 SaaS 模式下，下列哪一項通常仍由客戶管理？", o: ["作業系統修補", "使用者帳號的生命週期", "資料中心電力"], a: 1, e: "SaaS 下客戶仍需管理使用者帳號、權限與資料，作業系統修補則由服務商負責。" }
  ]
},
{
  title: "區域（Region）、可用區（AZ）與基礎設施",
  one: "Region 是地理上的區域；AZ 是同一區域內彼此獨立的資料中心群。兩者的設計決定可用性、延遲與資料駐留。",
  concepts: [
    "Region：由多個資料中心組成，故障範圍可能涵蓋整個區域。",
    "AZ（GCP 稱 Zone）：同一 Region 內獨立電力與網路的資料中心群，用於高可用部署。",
    "Edge／CDN 節點：靠近使用者的快取點，用於降低延遲。",
    "跨 AZ 部署可防範單一機房故障；跨 Region 才能應對區域級災難，但成本與資料同步複雜度較高。",
    "資料駐留（Data residency）：法規可能要求資料、備份與日誌必須存放在特定地區。"
  ],
  compare: {
    head: ["概念", "定義", "故障隔離範圍", "主要用途", "典型風險"],
    rows: [
      ["Region", "地理上的區域，包含多個資料中心", "可能涵蓋整個區域", "資料駐留、就近服務", "區域級事件影響較大"],
      ["AZ", "同一區域內獨立電力與網路的資料中心群", "單一 AZ 故障不影響其他 AZ", "高可用部署", "跨 AZ 流量費與延遲"],
      ["Edge", "靠近使用者的節點", "單一節點或地區", "內容快取、低延遲", "快取一致性與資料保護"]
    ]
  },
  tasks: [
    "查詢官方文件，確認台灣或鄰近地區可用的 Region 名稱（此資訊會變動，面試前需再次確認）",
    "說明為何「多 AZ」不等於「異地備援」",
    "畫出一個跨兩個 AZ 的 Web 應用架構草圖（可用文字描述）"
  ],
  sec: ["個人資料保護法：跨境傳輸與委外監督", "資料駐留：金融或公部門規範可能有額外要求", "ISO 27001:2022 A.5.23"],
  interview: [
    {
      q: "為什麼要做多 AZ 部署？什麼情況下要考慮多 Region？",
      a: "參考答案（框架：目的→條件→取捨）：\n1. 目的：多 AZ 可避免單一資料中心故障造成服務中斷，是常見的高可用基本配置。\n2. 條件：當業務要求能抵禦區域級災難（或法規要求異地備援）時，才考慮多 Region。\n3. 取捨：多 Region 的 RTO/RPO 較佳，但成本、資料同步與故障切換流程都更複雜，需以業務影響分析（BIA）決定。"
    }
  ],
  mcq: [
    { q: "AZ 的主要設計目的是？", o: ["提供獨立故障域以提高可用性", "降低軟體授權費用", "取代 CDN 功能"], a: 0, e: "AZ 之間電力與網路獨立，可隔離單一機房故障。" },
    { q: "若需防範整個城市級或區域級災難，應優先考慮？", o: ["單一 AZ 內擴充 CPU", "多 Region 部署", "增加單一主機的記憶體"], a: 1, e: "區域級災難需要跨 Region 的備援設計。" },
    { q: "資料駐留（Data residency）要求主要影響的是？", o: ["介面的顏色設計", "資料可以存放的地理位置", "使用者的登入方式"], a: 1, e: "資料駐留規範資料的地理存放位置，並可能延伸至備份與日誌。" }
  ]
},
{
  title: "成本模型與計價方式",
  one: "雲端把資本支出（CapEx）轉為營運支出（OpEx），但若沒有治理，用量與帳單可能快速失控。",
  concepts: [
    "計價方式：隨選（On-demand）、預留或承諾使用（Reserved／Savings Plans／Committed use）、Spot 或搶佔式（可中斷、價格最低）。",
    "容易被忽略的成本：資料傳出（Egress）、跨區或跨 AZ 流量、閒置資源、日誌與備份保留、未刪除的快照。",
    "成本治理的基礎：標籤（Tagging）、預算與告警、資源規模調整（Rightsizing）、責任歸屬。",
    "FinOps：結合財務、工程與業務的雲端成本管理文化。TCO（總持有成本）需納入人力、授權與風險成本。"
  ],
  compare: {
    head: ["計價方式", "適用情境", "優點", "注意事項"],
    rows: [
      ["隨選（On-demand）", "短期、不穩定或測試環境", "彈性高、無承諾", "單價較高"],
      ["預留／承諾使用", "穩定、長期的生產負載", "折扣明顯", "需承諾期限，用量改變時有風險"],
      ["Spot／搶佔式", "可中斷的批次或容錯工作", "價格最低", "可能被服務商回收資源"]
    ]
  },

const LAYERS = ["應用程式","資料","執行環境","中介軟體","作業系統","虛擬化","實體基礎設施"];
const LAYER_INFO = [
  "應用程式：SaaS 由服務商提供；PaaS 與 IaaS 由客戶開發或部署。即使是 SaaS，客戶仍需管理應用程式的存取設定。",
  "資料：無論哪種服務模型，資料的分類、加密、存取權限與保存期限都是客戶的責任。",
  "執行環境：PaaS 由服務商提供 runtime；IaaS 由客戶安裝與更新。",
  "中介軟體：例如資料庫引擎、訊息佇列。PaaS 常由服務商代管，IaaS 則由客戶自行維運。",
  "作業系統：IaaS 由客戶負責修補與強化（Hardening）；PaaS 與 SaaS 由服務商負責。",
  "虛擬化層：由服務商負責，客戶無法直接管理。",
  "實體基礎設施：機房、電力、冷卻與實體硬體，全部由服務商負責。"
];
// 1 = 客戶管理，0 = 服務商管理
const MODELS = { IaaS:[1,1,1,1,1,0,0], PaaS:[1,1,0,0,0,0,0], SaaS:[0,1,0,0,0,0,0] };

/* ================= 狀態（僅存於記憶體中，重新整理會重置） ================= */
let state = { day:0, view:"day", mock:false, tasks:{}, mcq:{}, model:"IaaS", layer:null };

/* ================= 輔助函式 ================= */
function esc(s){ return s; }

function totalTasks(){ return DAYS.reduce((n,d)=>n+d.tasks.length,0); }
function doneTasks(){
  let n=0;
  DAYS.forEach((d,di)=>d.tasks.forEach((_,ti)=>{ if(state.tasks[di]&&state.tasks[di][ti]) n++; }));
  return n;
}
function dayDone(di){
  return DAYS[di].tasks.every((_,ti)=>state.tasks[di]&&state.tasks[di][ti]);
}

/* ================= 事件 ================= */
function goDay(i){ state.day=i; state.view="day"; state.layer=null; refresh(); window.scrollTo(0,0); }
function showView(v){ state.view=v; refresh(); window.scrollTo(0,0); }
function toggleTask(di,ti){
  state.tasks[di]=state.tasks[di]||{};
  state.tasks[di][ti]=!state.tasks[di][ti];
  refresh();
}
function answer(di,qi,oi){
  state.mcq[di]=state.mcq[di]||{};
  if(state.mcq[di][qi]!==undefined) return;
  state.mcq[di][qi]=oi;
  refresh();
}
function setModel(m){ state.model=m; state.layer=null; refresh(); }
function showLayer(i){ state.layer=i; refresh(); }
function toggleMock(){ state.mock=!state.mock; refresh(); }
function toggleTheme(){ document.body.classList.toggle("dark"); }

/* ================= 渲染 ================= */
function refresh(){ renderSidebar(); renderMain(); }

function renderSidebar(){
  const pct = Math.round(doneTasks()/totalTasks()*100);
  document.getElementById("pct").textContent = pct+"%";
  document.getElementById("bar").style.width = pct+"%";
  let html="";
  DAYS.forEach((d,i)=>{
    const cls = ["day-btn"];
    if(state.view==="day" && state.day===i) cls.push("active");
    if(dayDone(i)) cls.push("done");
    html += `<button class="${cls.join(" ")}" onclick="goDay(${i})">第 ${i+1} 天｜${d.title}</button>`;
  });
  document.getElementById("dayList").innerHTML = html;
}

function stackHTML(){
  const m = MODELS[state.model];
  let html = `<div class="toolbar noprint">
    ${["IaaS","PaaS","SaaS"].map(x=>`<button class="tool ${state.model===x?"on":""}" onclick="setModel('${x}')">${x}</button>`).join("")}
  </div>
  <div class="legend">橘色＝客戶管理　綠色＝服務商管理（點選任一層查看說明）</div>
  <div class="stack">`;
  LAYERS.forEach((name,i)=>{
    const own = m[i]===1;
    html += `<div class="layer ${own?"own":"cloud"} ${state.layer===i?"sel":""}" onclick="showLayer(${i})">
      <span>${name}</span><span>${own?"客戶":"服務商"}</span></div>`;
  });
  html += `</div>`;
  html += `<div class="info">${state.layer!==null ? LAYER_INFO[state.layer] : "請點選左側任一層以查看說明。"}</div>`;
  return html;
}

function renderMain(){
  const main = document.getElementById("main");
  if(state.view==="bank"){ main.innerHTML = bankHTML(); return; }
  const di = state.day, d = DAYS[di];
  let h = "";
  h += `<div class="toolbar noprint">
    <button class="tool ${state.mock?"on":""}" onclick="toggleMock()">模擬面試模式：${state.mock?"開":"關"}</button>
    <button class="tool" onclick="toggleTheme()">深色／淺色</button>
    <button class="tool" onclick="window.print()">列印／存為 PDF</button>
  </div>`;
  h += `<h3>第 ${di+1} 天：${d.title}</h3>`;
  h += `<div class="sub">${d.one}</div>`;

  h += `<h2>核心概念</h2><ul>${d.concepts.map(c=>`<li>${c}</li>`).join("")}</ul>`;

  if(d.stack){ h += `<h2>責任分界視覺化</h2><div class="card">${stackHTML()}</div>`; }

  if(d.compare){
    h += `<h2>比較表</h2><div class="card" style="overflow-x:auto"><table>
      <tr>${d.compare.head.map(x=>`<th>${x}</th>`).join("")}</tr>
      ${d.compare.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
    </table></div>`;
  }

  h += `<h2>今日任務</h2><div class="card task">`;
  d.tasks.forEach((t,ti)=>{
    const checked = state.tasks[di]&&state.tasks[di][ti] ? "checked" : "";
    h += `<label><input type="checkbox" ${checked} onchange="toggleTask(${di},${ti})"> ${t}</label>`;
  });
  h += `</div>`;

  if(d.checklist){
    h += `<h2>面試前檢查清單</h2><div class="card"><ol>${d.checklist.map(c=>`<li>${c}</li>`).join("")}</ol></div>`;
  }
  h += `<h2>常見面試追問與參考答案</h2>`;
  d.interview.forEach(iv=>{
    h += `<div class="card"><b>Q：${iv.q}</b>
      <details ${state.mock?"":"open"}><summary>${state.mock?"顯示參考答案":"參考答案"}</summary>
      <div class="ref">${iv.a}</div></details></div>`;
  });

  h += `<h2>小測驗</h2>`;
  let correct=0, answered=0;
  d.mcq.forEach((q,qi)=>{
    const chosen = state.mcq[di] ? state.mcq[di][qi] : undefined;
    if(chosen!==undefined){ answered++; if(chosen===q.a) correct++; }
    h += `<div class="card"><b>${qi+1}. ${q.q}</b>`;
    q.o.forEach((opt,oi)=>{
      let cls="opt";
      if(chosen!==undefined){
        if(oi===q.a) cls+=" right";
        else if(oi===chosen) cls+=" wrong";
      }
      h += `<button class="${cls}" ${chosen!==undefined?"disabled":""} onclick="answer(${di},${qi},${oi})">${String.fromCharCode(65+oi)}. ${opt}</button>`;
    });
    if(chosen!==undefined) h += `<div class="exp">解析：${q.e}</div>`;
    h += `</div>`;
  });
  h += `<div class="score">本日測驗：已作答 ${answered}/${d.mcq.length}，答對 ${correct} 題</div>`;

  h += `<h2>資安與合規對應</h2><div>${d.sec.map(s=>`<span class="tag sec">${s}</span>`).join("")}</div>`;
  h += `<div class="sub" style="margin-top:12px">提醒：雲端服務的功能、名稱與價格會變動，面試前請以官方文件為準。</div>`;

  h += `<div class="nav-row noprint">
    <button class="tool" ${di===0?"disabled":""} onclick="goDay(${di-1})">上一天</button>
    <button class="tool" ${di===DAYS.length-1?"disabled":""} onclick="goDay(${di+1})">下一天</button>
  </div>`;
  main.innerHTML = h;
}

function bankHTML(){
  let h = `<h3>面試題庫（30 天）</h3><div class="sub">點選展開參考答案。建議先自行口述，再對照。</div><br>`;
  DAYS.forEach((d,di)=>{
    d.interview.forEach(iv=>{
      h += `<div class="card"><span class="tag">第 ${di+1} 天</span><b>${iv.q}</b>
        <details><summary>參考答案</summary><div class="ref">${iv.a}</div></details></div>`;
    });
  });
  return h;
}

refresh();
</script>
